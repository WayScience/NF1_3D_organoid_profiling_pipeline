[project]
name = "nf1-nextflow-pilot-zedprofiler"
version = "0.1.0"
description = "Isolated Python environment for the NF1 Nextflow ZEDProfiler pilot"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scikit-image>=0.23",
  "tifffile>=2024.2.12",
  "tomli>=2.0; python_version < '3.11'",
  "zedprofiler==0.1.3",
  "pyiceberg[pyarrow,sql-sqlite]>=0.10",
]

