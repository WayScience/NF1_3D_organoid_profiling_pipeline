[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[project]
name = "image-analysis-3d"
version = "0.0.1"
description = "Utility modules for the NF1 3D organoid profiling pipeline"
requires-python = ">=3.9"
authors = [{ name = "Michael J. Lippincott" }]
license = { text = "BSD 3-Clause License" }
dependencies = [
    # Core
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-image>=0.23",
    "tifffile>=2024.8.30",
    "networkx>=3.2",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    # Segmentation / imaging
    "cellpose>=3.0",
    "napari[pyside6]>=0.6.5; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "mahotas>=1.4",
    # PyTorch stack (keep these aligned)
    "torch>=2.4",
    "torchvision>=0.19",
    "torchaudio>=2.4",
    # Utilities
    "tomli>=2.0; python_version < '3.11'",
    "moviepy>=1.0.3",
    "rich>=13.7",
    "medim>=0.1",
]
[project.optional-dependencies]
dev = [
    # ...existing code...
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "black>=24.0",
    "ruff>=0.6",
    "pre-commit>=3.7",
    # ...existing code...
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["image_analysis_3D*"]
