[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[tool.uv]
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }

[project]
name = "image-analysis-3d"
version = "0.0.1"
description = "Utility modules for the NF1 3D organoid profiling pipeline"
requires-python = ">=3.9"
authors = [{ name = "Michael J. Lippincott" }]
license = { text = "BSD 3-Clause License" }
dependencies = [
    "pandas",
    "numpy<2.0.0",
    "scipy",
    "scikit-image",
    "tifffile",
    "cellpose",
    "napari",
    "networkx",
    "torch>=2.0.0,<2.4.0",
    "torchvision",
    "torchaudio",
    "cupy-cuda11x>=12.0.0",
    "cucim",
    "medim",
    "tqdm",
    "jupyter",
    "ipykernel",
    "mahotas",
    "matplotlib",
    "tomli",
    "moviepy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-xdist", "black", "ruff", "pre-commit", "rich"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["image_analysis_3D*"]
